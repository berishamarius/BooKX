<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Heilige Bibel - Rückseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100svh;overflow:hidden;background:#e8e0d0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0;}
body::before{content:'';position:fixed;inset:16px;border:1px solid rgba(90,32,0,.3);pointer-events:none;z-index:5;}
body::after{content:'';position:fixed;inset:28px;border:1px solid rgba(90,32,0,.13);pointer-events:none;z-index:5;}
.corner{position:fixed;width:56px;height:56px;pointer-events:none;z-index:6;}
.c-tl{top:14px;left:14px;border-top:2px solid rgba(90,32,0,.45);border-left:2px solid rgba(90,32,0,.45);}
.c-tr{top:14px;right:14px;border-top:2px solid rgba(90,32,0,.45);border-right:2px solid rgba(90,32,0,.45);}
.c-bl{bottom:14px;left:14px;border-bottom:2px solid rgba(90,32,0,.45);border-left:2px solid rgba(90,32,0,.45);}
.c-br{bottom:14px;right:14px;border-bottom:2px solid rgba(90,32,0,.45);border-right:2px solid rgba(90,32,0,.45);}
.book{width:min(500px,90vw);position:relative;z-index:1;display:block;text-decoration:none;cursor:pointer;}
.book img{width:100%;height:auto;display:block;box-shadow:none;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 2.2rem;text-align:center;}
.loss{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:.98rem;color:#1a0a04;line-height:1.75;margin-bottom:1.1rem;}
.rule{width:50%;height:1px;margin:0 auto .9rem;background:linear-gradient(to right,transparent,rgba(90,40,0,.4),transparent);}
.verse{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:1.02rem;color:#1a0a04;line-height:1.8;}
.verse-ref{font-family:'Cinzel',serif;font-size:.5rem;color:rgba(90,40,0,.7);letter-spacing:.15em;margin-top:5px;}
.copy{font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;color:rgba(240,200,130,.8);margin-top:1rem;letter-spacing:.12em;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"><style id="force-scheherazade">.ar,.verse .ar,.vb .ar,div.ar,span.ar,p.ar,.ra,.bismi-txt,.sh-rub,.sh-name,.sh-meta,.ttl-ar,.orn{font-family:'Scheherazade New','Arabic Typesetting','Traditional Arabic',serif !important;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}div.ar,span.ar,p.ar{font-weight:700 !important;font-size:1.72em !important;letter-spacing:.03em;line-height:2.28 !important;word-spacing:.1em;}.bismi-txt{font-size:2.15rem !important;line-height:1.9 !important;}.ra{font-size:2.45rem !important;line-height:1.45 !important;}.sh-rub{font-size:2rem !important;}.sh-name{font-size:5rem !important;line-height:1.18 !important;}.sh-meta{font-size:1rem !important;}.ttl-ar{font-size:1.5rem !important;}.tr{font-size:.93rem !important;line-height:1.82 !important;}</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32,4V60M12,18H52' stroke='%23C8A030' stroke-width='8' fill='none' stroke-linecap='square'/></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="Die%20Heilige%20Bibel%20Michele%20Icon.png">
<meta name="theme-color" content="#e8e0d0">
</head>
<body>
<div class="corner c-tl"></div><div class="corner c-tr"></div>
<div class="corner c-bl"></div><div class="corner c-br"></div>
<a class="book" href="cover.html">
  <img src="Bibel-Rueckseite-Michele.png" alt="Rückseite">
  <div class="overlay">
    <div class="loss">Du hast jemanden verloren, der dein Herz geformt hat.<br>Solche Menschen gehen nicht wirklich.<br>Sie leben weiter in dem, was du bist.</div>
    <div class="rule"></div>
    <div class="verse">„Kommet her zu mir alle, die ihr mühselig<br>und beladen seid, so will ich euch erquicken.“</div>
    <div class="verse-ref">Matthäus 11,28</div>

  </div>
</a>

<script>
(function(){
  var BM_KEY = 'KX_bookmark';
  var toast, toastTimer;
  function showToast(txt) {
    if (!toast) {
      toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(244,229,204,.96);color:#4b341f;font-family:sans-serif;font-size:.78rem;letter-spacing:.08em;padding:9px 20px;border-radius:10px;border:1px solid #cfb790;pointer-events:none;z-index:999;transition:opacity .3s,transform .3s;box-shadow:0 12px 24px rgba(0,0,0,.24)';
      document.body.appendChild(toast);
    }
    toast.textContent = txt;
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(6px)'; }, 1800);
  }
  document.addEventListener('click', function(e) {
    var el = e.target;
    while (el && el !== document.body) {
      if (el.matches && el.matches('.verse, .vb')) break;
      el = el.parentElement;
    }
    if (!el || el === document.body) return;
    if (e.target.tagName === 'A') return;
    var id = el.id;
    if (!id) return;
    var data = { url: location.pathname + '#' + id, title: document.title, id: id, ts: Date.now() };
    try { localStorage.setItem(BM_KEY, JSON.stringify(data)); } catch(_){}
    showToast('✦ Lesezeichen gesetzt');
  });
})();
</script>
</body>
</html>
