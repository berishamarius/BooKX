<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Heilige Bibel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  background:
    repeating-linear-gradient( 45deg,transparent,transparent 36px,rgba(200,160,48,.028) 36px,rgba(200,160,48,.028) 37px),
    repeating-linear-gradient(-45deg,transparent,transparent 36px,rgba(200,160,48,.028) 36px,rgba(200,160,48,.028) 37px),
    #3A0E1A;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;
  border:2px solid rgba(180,138,30,.42);
  pointer-events:none;z-index:100;
}
.page{
  width:500px;
  max-width:calc(100vw - 1.2cm);
  height:min(calc(100vh - 1.2cm), 680px);
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
  background:#4A1020;
  overflow:hidden;
}
.frame{position:absolute;inset:0;z-index:2;pointer-events:none;}

.grail-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0.45;pointer-events:none;}
.cross-svg{position:relative;z-index:3;flex-shrink:0;}
.title-block{
  position:relative;z-index:3;
  text-align:center;width:100%;
}
.heilige{
  font-family:'Cinzel',serif;
  font-size:.85rem;letter-spacing:.55em;
  color:#EDD882;display:block;margin-bottom:14px;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
.bibel{
  font-family:'Cinzel',serif;
  font-size:clamp(3rem,8vw,4.4rem);
  font-weight:700;line-height:1.1;
  color:#EDD882;
  text-shadow:0 3px 20px rgba(0,0,0,.55);
  display:block;letter-spacing:.08em;
}
.btn-wrap{position:relative;z-index:3;}
.btn{
  display:inline-block;padding:10px 48px;
  color:#EDD882;text-decoration:none;
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.22em;
  border:1px solid rgba(180,138,30,.34);
  background:transparent;transition:color .22s,border-color .22s;
}
.btn:hover{color:#C8A030;border-color:rgba(200,160,48,.65);}
</style>
</head>
<body>
<div class="page">

  <!-- FRAME -->
  <svg class="frame" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 100 100" preserveAspectRatio="none"
       style="width:100%;height:100%;position:absolute;top:0;left:0;">

    <!-- OUTER BOLD LINE -->
    <rect x="2.5" y="2.5" width="95" height="95"
          fill="none" stroke="#C8A030" stroke-width="0.85"/>
    <!-- INNER COMPANION LINE -->
    <rect x="5" y="5" width="90" height="90"
          fill="none" stroke="#C8A030" stroke-width="0.3" opacity="0.6"/>
    <!-- INNERMOST ACCENT -->
    <rect x="8" y="8" width="84" height="84"
          fill="none" stroke="#9A7020" stroke-width="0.18" opacity="0.45"/>

    <!-- CORNER L-TICKS -->
    <g stroke="#C8A030" stroke-width="0.55" opacity="0.9">
      <line x1="5" y1="5"  x2="18" y2="5"/>  <line x1="5" y1="5"  x2="5"  y2="18"/>
      <line x1="95" y1="5"  x2="82" y2="5"/> <line x1="95" y1="5"  x2="95" y2="18"/>
      <line x1="5" y1="95" x2="18" y2="95"/> <line x1="5" y1="95" x2="5"  y2="82"/>
      <line x1="95" y1="95" x2="82" y2="95"/><line x1="95" y1="95" x2="95" y2="82"/>
    </g>

    <!-- SECTION DIVIDERS -->
    <line x1="8"  y1="36" x2="92" y2="36" stroke="#C8A030" stroke-width="0.45" opacity="0.75"/>
    <line x1="20" y1="37.2" x2="80" y2="37.2" stroke="#9A7020" stroke-width="0.15" opacity="0.4"/>
    <line x1="8"  y1="70" x2="92" y2="70" stroke="#C8A030" stroke-width="0.45" opacity="0.75"/>
    <line x1="20" y1="68.8" x2="80" y2="68.8" stroke="#9A7020" stroke-width="0.15" opacity="0.4"/>
  </svg>


  <!-- HEILIGE DREIEINIGKEIT – SCUTUM FIDEI (Schild der Dreifaltigkeit) -->
  <svg class="grail-bg" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 100 136" preserveAspectRatio="xMidYMid meet">
    <!-- Scheitel oben (50,34) = Kreuz-Medaillon (kein Kreis – Kreuz ersetzt ihn) -->
    <!-- Mitte DEUS (50,80), Vater (16,112), Sohn (84,112) -->
    <line x1="50" y1="34" x2="16" y2="112" stroke="#EDD882" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="50" y1="34" x2="84" y2="112" stroke="#EDD882" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="16" y1="112" x2="84" y2="112" stroke="#EDD882" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="50" y1="80" x2="50" y2="34" stroke="#EDD882" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="50" y1="80" x2="16" y2="112" stroke="#EDD882" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="50" y1="80" x2="84" y2="112" stroke="#EDD882" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="50" cy="80" r="7" fill="none" stroke="#EDD882" stroke-width="1.4"/>
    <circle cx="16" cy="112" r="7" fill="none" stroke="#EDD882" stroke-width="1.4"/>
    <circle cx="84" cy="112" r="7" fill="none" stroke="#EDD882" stroke-width="1.4"/>
  </svg>

  <!-- CROSS MEDALLION -->
  <svg class="cross-svg" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 120 120" width="110" height="110">
    <circle cx="60" cy="60" r="54" fill="rgba(0,0,0,.18)" stroke="#7A5518" stroke-width="1.2" opacity="0.7"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="#9A7020" stroke-width="0.6" opacity="0.55"/>
    <g stroke="#8A6418" stroke-width="0.9" opacity="0.58">
      <line x1="60" y1="6"   x2="60" y2="12"/>
      <line x1="60" y1="108" x2="60" y2="114"/>
      <line x1="6"  y1="60"  x2="12" y2="60"/>
      <line x1="108" y1="60" x2="114" y2="60"/>
    </g>
    <g fill="#C8A030" opacity="0.93">
      <rect x="55.5" y="16" width="9"  height="88"/>
      <rect x="28"   y="44" width="64" height="11"/>
      <rect x="51.5" y="16" width="17" height="4"/>
      <rect x="51.5" y="100" width="17" height="4"/>
      <rect x="26"   y="42" width="4"  height="4"/>
      <rect x="26"   y="53" width="4"  height="4"/>
      <rect x="90"   y="42" width="4"  height="4"/>
      <rect x="90"   y="53" width="4"  height="4"/>
    </g>
    <g stroke="rgba(0,0,0,.18)" stroke-width="0.55">
      <line x1="58" y1="16" x2="58" y2="104"/>
      <line x1="62" y1="16" x2="62" y2="104"/>
      <line x1="28" y1="48" x2="92" y2="48"/>
      <line x1="28" y1="52" x2="92" y2="52"/>
    </g>
  </svg>

  <!-- TITLE -->
  <div class="title-block">
    <span class="heilige">DIE HEILIGE</span>
    <span class="bibel">Bibel</span>
  </div>

  <div class="btn-wrap">
    <a class="btn" href="index.html">L E S E N</a>
  </div>

</div>
<script src="reader.js"></script>
</body>
</html>
