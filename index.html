<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KX Books · Digitale Bücher</title>
<meta name="description" content="Al-Quran und Die Heilige Bibel – digitale Ausgaben von KX KroniX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Noto+Serif:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='56' font-family='serif' fill='%238a5800'>&#x06DE;</text></svg>">
<meta name="theme-color" content="#111">
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  min-height:100vh;
  background:#0e0e0e;
  color:#e8dcc0;
  font-family:'Noto Serif',Georgia,serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

/* ── Hintergrund-Ornament ── */
body::before{
  content:'✦';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:60vw;
  color:rgba(192,155,60,.025);
  pointer-events:none;
  z-index:0;
  line-height:1;
}

/* ── Obere & untere Zierleiste ── */
body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(to right,transparent,rgba(192,155,60,.7),transparent);
  pointer-events:none;
}

.kx-logo{
  font-family:'Scheherazade New',serif;
  font-size:.72rem;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:rgba(192,155,60,.45);
  margin-bottom:12px;
  position:relative;z-index:1;
}

h1{
  font-family:'Scheherazade New',serif;
  font-size:clamp(1.6rem,5vw,2.8rem);
  font-weight:400;
  color:#c9a84c;
  text-align:center;
  margin-bottom:8px;
  position:relative;z-index:1;
}

.subtitle{
  font-size:.88rem;
  color:rgba(232,220,192,.4);
  margin-bottom:56px;
  position:relative;z-index:1;
  letter-spacing:.08em;
}

/* ── Divider ── */
.div{
  display:flex;align-items:center;gap:16px;
  width:min(480px,90vw);
  margin-bottom:56px;
  position:relative;z-index:1;
}
.div::before,.div::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(192,155,60,.3));}
.div::after{background:linear-gradient(to left,transparent,rgba(192,155,60,.3));}
.div span{font-family:'Scheherazade New',serif;font-size:1.4rem;color:rgba(192,155,60,.45);}

/* ── Buch-Karten ── */
.books{
  display:flex;
  flex-wrap:wrap;
  gap:32px;
  justify-content:center;
  position:relative;z-index:1;
}

.book{
  width:min(220px,42vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  gap:20px;
  transition:transform .3s;
}
.book:hover{transform:translateY(-6px);}

.book-cover{
  width:100%;
  position:relative;
}
.book-cover img{
  width:100%;
  height:auto;
  display:block;
  border-radius:2px;
  box-shadow:0 12px 48px rgba(0,0,0,.65),0 0 0 1px rgba(192,155,60,.15);
}

.book-title{
  font-family:'Scheherazade New',serif;
  font-size:1.05rem;
  color:#c9a84c;
  text-align:center;
  line-height:1.5;
}
.book-sub{
  font-size:.75rem;
  color:rgba(232,220,192,.38);
  letter-spacing:.06em;
  margin-top:4px;
}

/* ── Footer ── */
footer{
  margin-top:72px;
  font-size:.7rem;
  color:rgba(232,220,192,.2);
  letter-spacing:.1em;
  text-align:center;
  position:relative;z-index:1;
}

@media(max-width:500px){
  .books{gap:20px;}
  .book{width:min(160px,44vw);}
}
</style>
</head>
<body>

<p class="kx-logo">KX Books · KX KroniX</p>

<h1>Digitale Bücher</h1>
<p class="subtitle">Kostenlos lesen · Im Browser · Kein Download nötig</p>

<div class="div"><span>❧</span></div>

<div class="books">

  <a class="book" href="/dist-alquran/cover.html">
    <div class="book-cover">
      <img src="/dist-alquran/Cover.png" alt="Al-Quran Cover" loading="lazy">
    </div>
    <div>
      <div class="book-title">القرآن الكريم<br>Al-Quran</div>
      <div class="book-sub">Deutsch · 114 Suren</div>
    </div>
  </a>

  <a class="book" href="/dist-diebibel/cover.html">
    <div class="book-cover">
      <img src="/dist-diebibel/Die Heilige Bibel - Rot.png" alt="Die Heilige Bibel Cover" loading="lazy">
    </div>
    <div>
      <div class="book-title">Die Heilige Bibel</div>
      <div class="book-sub">Deutsch · Catholica 1906</div>
    </div>
  </a>

</div>

<footer>
  &copy; 2026 KX KroniX · Alle Rechte vorbehalten
  <div style="margin-top:6px;font-size:.62rem;color:rgba(232,220,192,.12)">kxkronix.tech</div>
</footer>

</body>
</html>
