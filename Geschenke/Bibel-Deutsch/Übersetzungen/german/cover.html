<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Heilige Bibel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  background:
    repeating-linear-gradient( 45deg,transparent,transparent 36px,rgba(200,160,48,.028) 36px,rgba(200,160,48,.028) 37px),
    repeating-linear-gradient(-45deg,transparent,transparent 36px,rgba(200,160,48,.028) 36px,rgba(200,160,48,.028) 37px),
    #3A0E1A;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;
  border:2px solid rgba(180,138,30,.42);
  pointer-events:none;z-index:100;
}
.page{
  width:500px;
  max-width:calc(100vw - 1.2cm);
  height:min(calc(100vh - 1.2cm), 680px);
  position:relative;
  background:#4A1020;
  overflow:hidden;
}
.frame{position:absolute;inset:0;z-index:2;pointer-events:none;}

.cross-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.title-block{
  position:absolute;z-index:3;
  top:44%;left:0;right:0;
  transform:translateY(-50%);
  text-align:center;width:100%;
}
.heilige{
  font-family:'Cinzel',serif;
  font-size:1.15rem;letter-spacing:.55em;
  color:#EDD882;display:block;margin-bottom:14px;
  text-shadow:0 0 18px rgba(74,16,32,1),0 0 28px rgba(74,16,32,1),0 2px 12px rgba(0,0,0,.8);
}
.bibel{
  font-family:'Cinzel',serif;
  font-size:clamp(2rem,5.5vw,2.8rem);
  font-weight:700;line-height:1.1;
  color:#EDD882;
  text-shadow:0 0 22px rgba(74,16,32,1),0 0 38px rgba(74,16,32,1),0 3px 20px rgba(0,0,0,.9);
  display:block;letter-spacing:.08em;
}
.btn-wrap{position:absolute;z-index:3;bottom:11%;left:0;right:0;text-align:center;}
.btn{
  display:inline-block;padding:10px 48px;
  color:#EDD882;text-decoration:none;
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.22em;
  border:1px solid rgba(180,138,30,.7);
  background:#4A1020;
  transition:color .22s,border-color .22s,background .22s;
}
.btn:hover{color:#C8A030;border-color:rgba(200,160,48,.9);background:#5C1828;}
</style>
</head>
<body>
<div class="page">

  <!-- FRAME -->
  <svg class="frame" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 100 100" preserveAspectRatio="none"
       style="width:100%;height:100%;position:absolute;top:0;left:0;">

    <!-- OUTER BOLD LINE -->
    <rect x="2.5" y="2.5" width="95" height="95"
          fill="none" stroke="#C8A030" stroke-width="0.85"/>
    <!-- INNER COMPANION LINE -->
    <rect x="5" y="5" width="90" height="90"
          fill="none" stroke="#C8A030" stroke-width="0.3" opacity="0.6"/>
    <!-- INNERMOST ACCENT -->
    <rect x="8" y="8" width="84" height="84"
          fill="none" stroke="#9A7020" stroke-width="0.18" opacity="0.45"/>

    <!-- CORNER L-TICKS -->
    <g stroke="#C8A030" stroke-width="0.55" opacity="0.9">
      <line x1="5" y1="5"  x2="18" y2="5"/>  <line x1="5" y1="5"  x2="5"  y2="18"/>
      <line x1="95" y1="5"  x2="82" y2="5"/> <line x1="95" y1="5"  x2="95" y2="18"/>
      <line x1="5" y1="95" x2="18" y2="95"/> <line x1="5" y1="95" x2="5"  y2="82"/>
      <line x1="95" y1="95" x2="82" y2="95"/><line x1="95" y1="95" x2="95" y2="82"/>
    </g>

  </svg>

  <!-- KREUZ -->
  <svg class="cross-bg" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 100 136" preserveAspectRatio="none">
    <defs>
      <linearGradient id="cgh" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#7a5800" stop-opacity="0.9"/>
        <stop offset="40%"  stop-color="#C8A030" stop-opacity="0.95"/>
        <stop offset="60%"  stop-color="#D4AA3A" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#7a5800" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <path d="M 44,13 H 56 V 38 H 88 V 50 H 56 V 123 H 44 V 50 H 12 V 38 H 44 Z"
          fill="url(#cgh)"/>
    <path d="M 44,13 H 56 V 38 H 88 V 50 H 56 V 123 H 44 V 50 H 12 V 38 H 44 Z"
          fill="none" stroke="rgba(255,235,150,0.25)" stroke-width="0.5"/>
  </svg>

  <!-- TITLE -->
  <div class="title-block"></div>

  <div class="btn-wrap">
    <a class="btn" href="vorwort.html">L E S E N</a>
  </div>

</div>
<script src="reader.js"></script>
</body>
</html>
